<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXT STORE - VIP</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXT STORE">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --main-red: #ff3b30; --vip-orange: #ff9500; --bg-dark: #000; --card-bg: #111; }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; text-align: center; padding: 0; margin: 0; direction: rtl; overflow-x: hidden; }
        
        /* Containers */
        .container { max-width: 450px; margin: auto; padding: 40px 20px; }
        .logo-text { font-size: 45px; font-weight: 900; letter-spacing: -2px; color: #fff; margin-bottom: 5px; direction: ltr; }
        .logo-text span { color: var(--main-red); }
        
        .welcome-msg { color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .store-desc { color: #888; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        
        /* Search Bar */
        .search-bar { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #1a1a1a; color: white; margin-bottom: 25px; box-sizing: border-box; outline: none; text-align: center; font-size: 16px; }

        /* App Cards */
        .app-card { background: var(--card-bg); padding: 25px; border-radius: 30px; margin-bottom: 25px; border: 1px solid #222; position: relative; overflow: hidden; }
        .app-icon { width: 85px; height: 85px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); object-fit: cover; }
        .app-info { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 5px; direction: ltr; }
        .app-details { color: #666; font-size: 13px; margin-bottom: 20px; direction: ltr; }
        
        /* Buttons */
        .btn-install { display: block; background: linear-gradient(45deg, var(--main-red), var(--vip-orange)); color: #fff; padding: 16px; text-decoration: none; border-radius: 14px; font-weight: bold; font-size: 17px; cursor: pointer; border: none; width: 100%; }
        .tg-btn { display: flex; align-items: center; justify-content: center; background: #229ED9; color: white; padding: 14px; text-decoration: none; border-radius: 14px; font-weight: bold; margin-top: 15px; font-size: 16px; width: 100%; box-sizing: border-box; }
        .tg-btn i { margin-left: 10px; }

        /* Lock Screens */
        .lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; box-sizing: border-box; }
        .error-title { color: var(--main-red); font-size: 24px; font-weight: 800; margin: 20px 0 10px 0; }
        .instruction-text { color: #eee; font-size: 16px; margin-bottom: 25px; line-height: 1.5; }
        
        .udid-display { background: #111; border: 1px dashed var(--main-red); padding: 18px; border-radius: 15px; color: var(--main-red); font-family: monospace; font-size: 13px; margin-bottom: 30px; width: 100%; word-break: break-all; box-sizing: border-box; font-weight: bold; }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 5px solid #222; border-top: 5px solid var(--main-red); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer { margin-top: 40px; font-size: 12px; color: #333; }
    </style>
</head>
<body>

    <script>
        if (window.navigator.standalone === false && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
            document.write(`
                <div class="lock-screen">
                    <div class="logo-text">NEXT<span>STORE</span></div>
                    <h2 class="error-title">ACCESS LOCKED</h2>
                    <p class="instruction-text">بۆ پاراستنا ستۆرێ و ئەمنیاتێ، دڤێت ئەپی بێخیە سەر شاشێ (Add to Home Screen).</p>
                    <img src="https://images.macrumors.com/article-new/2025/08/ios-add-to-home-screen1.jpg" style="width:200px; border-radius:15px; opacity:0.6;">
                </div>
            `);
        }
    </script>

    <div id="unregistered-screen" class="lock-screen" style="display: none;">
        <div class="logo-text">NEXT<span>STORE</span></div>
        <div class="error-title">DEVICE NOT VERIFIED</div>
        <div class="instruction-text">بۆ تۆمارکرنا UDID یێ خۆ نامەکێ ڤرێکه</div>
        <div class="udid-display" id="user-udid-label">---</div>
        <a href="https://t.me/nextstore9" class="tg-btn">Contact Admin <i class="fab fa-telegram"></i></a>
    </div>

    <div id="overlay">
        <div class="spinner"></div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <div class="logo-text">NEXT<span>STORE</span></div>
        <div class="welcome-msg" id="welcome-user">Welcome VIP</div>
        <input type="text" id="searchInput" class="search-bar" placeholder="لێگەڕیان..." onkeyup="searchApp()">

        <div id="appList">
            <div class="app-card">
                <img src="8ball.png" class="app-icon">
                <div class="app-info">8 Ball Pool VIP</div>
                <button id="install-8ball" class="btn-install">Direct Install</button>
            </div>
            <div class="app-card">
                <img src="insta.png" class="app-icon">
                <div class="app-info">Instagram VIP</div>
                <button id="install-insta" class="btn-install">Direct Install</button>
            </div>
        </div>
        
        <a href="https://t.me/nextstore9" class="tg-btn">Join Telegram <i class="fab fa-telegram"></i></a>
        <div class="footer">© 2026 NEXT STORE</div>
    </div>

    <script>
        // --- داتابەیسا کڕیاران (لێرە کڕیارێن نوو زێدە بکە) ---
const registeredUsers = {
    "00008101-001A24681E03001E": {
        name: "Hogr",
        links: { 
            "8ball": "itms-services://?action=download-manifest&url=https://LINK_1.plist", 
            "insta": "itms-services://?action=download-manifest&url=https://LINK_2.plist" 
        }
    }, // ئەڤ ڤارگۆلە (,) گەلەک گرنگە ل ڤێرە بنێی

    "00008110-0004089A3602601E": {
        name: "RojAmedi2", 
        links: { 
            "8ball": "itms-services://?action=download-manifest&url=https://LINK_NEW_1.plist", 
            "insta": "itms-services://?action=download-manifest&url=https://LINK_NEW_2.plist" 
        }
    }
};


        const urlParams = new URLSearchParams(window.location.search);
        const userUDID = urlParams.get('udid');

        function startApp() {
            const main = document.getElementById('main-content');
            const unreg = document.getElementById('unregistered-screen');
            const label = document.getElementById('user-udid-label');

            if (userUDID && registeredUsers[userUDID]) {
                main.style.display = 'block';
                document.getElementById('welcome-user').innerText = "بخێر بێی، " + registeredUsers[userUDID].name;
            } else {
                unreg.style.display = 'flex';
                label.innerText = userUDID ? userUDID : "UDID NOT FOUND";
            }
        }

        function searchApp() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getElementsByClassName('app-info')[0].innerText.toLowerCase();
                cards[i].style.display = name.includes(input) ? "block" : "none";
            }
        }

        function installLink(url) {
            document.getElementById('overlay').style.display = 'flex';
            setTimeout(() => { window.location.href = url; }, 2000);
        }

        window.onload = startApp;
    </script>
</body>
</html>
